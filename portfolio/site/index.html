<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gaurav-agarwal.nyc</title>
<meta name="description" content="Gaurav Agarwal: projects, experience, stack and the log, opened in an editor.">
<meta property="og:title" content="Gaurav Agarwal">
<meta property="og:description" content="ML and quant research. MS Electrical Engineering at Columbia.">
<meta property="og:url" content="https://gaurav-agarwal.nyc/">
<meta property="og:type" content="website">
<link rel="canonical" href="https://gaurav-agarwal.nyc/site/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one editor window, centered — a wheel of sections on the left, a
   terminal buffer in the middle, an ASCII eye on the right, a status bar and a
   desk underneath. Dark-first, single look; palettes swap from themes/. */
:root {
  --bg: #0b0a0d;
  --ink: #dcd4cd;
  --chrome: #a29b96;
  --dim: #77807c;
  --rule: #34302f;
  --line: #19171b;
  --accent: #ff3d9a;
  --worm: 120, 124, 232;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --display: "Archivo", system-ui, sans-serif;
  --wide: 1040px;
  --margin: 40px;
  --wheel-w: 232px;
  --eye-w: 184px;
  --bar-h: 58px;
  --desk-h: 0px;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 12.5px/1.45 var(--mono);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background-color .4s ease, color .4s ease;
}
a, button, input { color: inherit; font: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
::selection { background: var(--accent); color: var(--bg); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- stage ---------- */
.stage {
  position: relative;
  height: 100%;
  min-height: 520px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  padding-inline: var(--margin);
}
.top, .editor, .bar, .desk { width: 100%; max-width: var(--wide); margin-inline: auto; }

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-block: 22px 14px;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 40px;
  text-decoration: none;
  color: var(--ink);
  letter-spacing: .02em;
}
.mark {
  font: 800 15px/1 var(--display);
  font-stretch: 62%;
  letter-spacing: -.04em;
  padding: 2px 3px 1px;
  border: 1.5px solid currentColor;
  border-radius: 1px;
}
.elsewhere { display: flex; gap: 18px; }
.elsewhere a { color: var(--chrome); text-decoration: none; min-height: 40px; display: inline-flex; align-items: center; }
.elsewhere a:hover { color: var(--ink); }

/* ---------- editor ---------- */
.editor {
  position: relative;
  display: grid;
  grid-template-columns: var(--wheel-w) minmax(0, 1fr) var(--eye-w);
  min-height: 0;
}
.tabline { display: none; }

.wheel {
  position: relative;
  border-right: 1px solid var(--rule);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  cursor: grab;
}
.wheel.is-dragging { cursor: grabbing; }
.ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.card {
  position: absolute;
  left: 0;
  top: 0;
  width: 150px;
  padding: 0;
  text-align: left;
  border: 1px solid color-mix(in srgb, var(--chrome) 45%, transparent);
  background: var(--line);
  transform-origin: 0 50%;
  will-change: transform;
  filter: grayscale(.55) brightness(.62);
  transition: filter .25s ease, border-color .25s ease;
}
.card canvas { display: block; width: 100%; height: 72px; }
.card .lbl {
  display: block;
  padding: 2px 6px 3px;
  font-size: 10px;
  color: var(--chrome);
}
.card.is-on { filter: none; border-color: var(--ink); }
.card.is-on .lbl { color: var(--ink); font-size: 12px; }
.card:hover { filter: grayscale(.2) brightness(.9); }
.card.is-on:hover { filter: none; }
.pointer {
  position: absolute;
  width: 0; height: 0;
  border-block: 6px solid transparent;
  border-left: 9px solid var(--ink);
  pointer-events: none;
}
.wheel-foot {
  position: absolute;
  left: 4px;
  bottom: 6px;
  margin: 0;
  display: grid;
  gap: 2px;
  color: var(--chrome);
  font-size: 11px;
  pointer-events: none;
  text-shadow: 0 0 6px var(--bg);
}
.wheel-foot span:first-child { color: var(--dim); font-variant-numeric: tabular-nums; }

.pane {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  padding-left: 28px;
}
.winbar {
  margin: 0;
  padding: 12px 0 10px 28px;
  color: var(--chrome);
  font-size: 12.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.buffer {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding-bottom: 18px;
  scrollbar-width: none;
  mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 34px), transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14px, #000 calc(100% - 34px), transparent 100%);
}
.buffer::-webkit-scrollbar { display: none; }
.buffer:focus-visible { outline: none; }

.block { margin: 0 0 14px; }
.ps1 { color: var(--chrome); }
.ps1 .path { color: var(--dim); }
.cmdline { margin: 0; white-space: pre-wrap; }
.cmdline::before { content: "› "; color: var(--chrome); }
.caret {
  display: inline-block;
  width: .62em;
  height: 1.1em;
  vertical-align: -.2em;
  background: var(--ink);
  animation: blink 1.05s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.out { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.muted { color: var(--dim); }
.hot { color: var(--accent); }
.err { color: var(--accent); }

.kv {
  display: grid;
  grid-template-columns: 8ch max-content minmax(0, 1fr);
  column-gap: 2ch;
  align-items: center;
  font-variant-numeric: tabular-nums;
}
.kv > :nth-child(3n+2) { text-align: right; }
.meter { display: inline-flex; align-items: center; gap: 2ch; color: var(--dim); white-space: nowrap; }
.meter i { font-style: normal; letter-spacing: -.08em; }
.meter i b { color: var(--accent); font-weight: 400; }

/* git log --graph */
.graph {
  position: relative;
  margin: 8px 0 6px 8px;
  padding: 18px 0 4px 0;
  border-left: 1px solid var(--rule);
}
.graph::before {
  content: "^";
  position: absolute;
  left: -4px;
  top: -10px;
  color: var(--rule);
  font-size: 11px;
}
.month {
  position: relative;
  margin: 18px 0 12px 0;
  padding-left: 9px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.month::before {
  content: "";
  position: absolute;
  left: -4px;
  top: .5em;
  width: 7px; height: 7px;
  background: var(--chrome);
}
.month::after {
  content: "";
  position: absolute;
  left: 3px;
  right: auto;
  width: calc(100% - 3px);
  max-width: 160px;
  top: calc(1.45em + 6px);
  height: 14px;
  border-top: 1px solid var(--rule);
  border-right: 1px solid var(--rule);
  pointer-events: none;
}
.month .muted { margin-left: .5ch; }
.commit {
  position: relative;
  display: block;
  width: min(100%, 230px);
  margin: 26px 0 30px 22px;
  padding: 6px 6px 8px;
  border: 1px solid var(--rule);
  background: color-mix(in srgb, var(--line) 70%, transparent);
  text-decoration: none;
  color: var(--ink);
  transition: border-color .2s ease, transform .2s ease;
}
.commit.wide { width: min(100%, 440px); }
.commit:hover, .commit.is-focus { border-color: var(--ink); }
.commit.is-focus { transform: translateX(4px); }
.commit canvas { display: block; width: 100%; height: 96px; border-bottom: 1px solid var(--accent); background: var(--bg); }
.commit .name { margin: 6px 0 2px; }
.commit .meta { margin: 0; font-size: 11px; color: var(--dim); }
.commit .desc { margin: 4px 0 0; font-size: 11px; color: var(--chrome); }
.commit ul { margin: 6px 0 0; padding-left: 2ch; color: var(--chrome); font-size: 11.5px; }
.commit li::marker { content: "- "; color: var(--dim); }
.badge {
  display: inline-block;
  min-width: 2.4ch;
  padding: 0 4px;
  background: var(--accent);
  color: var(--bg);
  text-align: center;
  font-size: 10.5px;
  line-height: 1.4;
  font-variant-numeric: tabular-nums;
}

.table { display: grid; grid-template-columns: max-content max-content minmax(0, 1fr); column-gap: 2ch; row-gap: 2px; }
.table .h { color: var(--dim); }
.bars { color: var(--accent); letter-spacing: -.06em; white-space: nowrap; }
.bars s { text-decoration: none; color: var(--rule); }
.post { margin: 0 0 12px; max-width: 64ch; }
.post h3 { margin: 0; font: inherit; color: var(--ink); }
.post p { margin: 2px 0 0; color: var(--chrome); }
.prose { max-width: 62ch; color: var(--chrome); }
.prose p { margin: 0 0 8px; }
.prose strong { color: var(--ink); font-weight: 500; }
.linkline a { color: var(--ink); text-underline-offset: 3px; text-decoration-color: var(--dim); }
.linkline a:hover { text-decoration-color: var(--accent); }
.copy {
  margin-left: 1ch;
  padding: 0 6px;
  border: 1px solid var(--rule);
  color: var(--chrome);
  font-size: 11px;
}
.copy:hover { color: var(--ink); border-color: var(--chrome); }
.bgrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bgsw { width: 26px; height: 26px; border: 1px solid var(--rule); }
.bgsw:hover, .bgsw[aria-pressed="true"] { outline: 1px solid var(--ink); outline-offset: 2px; }
.bgany { display: inline-flex; align-items: center; gap: 6px; color: var(--chrome); cursor: pointer; }
.bgany input { width: 28px; height: 28px; padding: 0; border: 1px solid var(--rule); background: none; cursor: pointer; }
.palettes { display: flex; flex-wrap: wrap; gap: 10px; }
.palette {
  width: 150px;
  padding: 6px;
  border: 1px solid var(--rule);
  text-align: left;
}
.palette:hover, .palette[aria-pressed="true"] { border-color: var(--ink); }
.palette .sw { display: flex; height: 26px; margin-bottom: 6px; }
.palette .sw span { flex: 1; }
.palette small { color: var(--dim); }

.prompt {
  display: flex;
  flex-direction: column;
  padding: 6px 0 10px;
}
.prompt-row { display: flex; align-items: center; gap: 1ch; }
.prompt-row > span { color: var(--chrome); }
.prompt input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: transparent;
  outline: none;
  caret-color: var(--ink);
  padding: 0;
}
.prompt input::placeholder { color: var(--dim); opacity: .55; }

/* eye */
.eye-host {
  position: relative;
  padding: 26px 0 0 16px;
  pointer-events: none;
}
.eye-host canvas { display: block; width: 100%; height: 128px; }
.eye-read {
  margin: 10px 0 0 56px;
  font-size: 9px;
  line-height: 1.25;
  color: var(--chrome);
  white-space: pre;
  font-variant-numeric: tabular-nums;
}

/* ---------- status bar ---------- */
.bar {
  position: relative;
  display: grid;
  grid-template-columns: var(--wheel-w) minmax(0, 1fr) auto;
  align-items: start;
  gap: 16px;
  min-height: var(--bar-h);
  padding-block: 10px max(12px, env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--rule);
}
.bar p { margin: 0; }
.bar-id { display: grid; gap: 6px; }
.bar-title {
  font: 500 13px/1 var(--display);
  font-stretch: 112%;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.bar-sub { color: var(--chrome); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-state { display: flex; gap: 0; padding-left: 28px; flex-wrap: wrap; }
.col { display: grid; gap: 6px; width: 96px; }
.col .value { white-space: nowrap; }
.label { font-size: 9.5px; letter-spacing: .16em; color: var(--chrome); text-transform: uppercase; }
.value { font-size: 12.5px; }
.value.hot { color: var(--accent); font-variant-numeric: tabular-nums; }
.den {
  position: absolute;
  top: -9px;
  right: 190px;
  width: 18px;
  height: 18px;
  border: 1px solid var(--rule);
  border-radius: 50%;
  background: var(--bg);
  display: grid;
  place-items: center;
}
.den::after {
  content: "";
  width: 8px;
  height: 2px;
  background: radial-gradient(circle, var(--chrome) 1px, transparent 1.2px) 0 0 / 4px 2px repeat-x;
}
.den:hover, .den[aria-pressed="true"] { border-color: var(--chrome); }
.bar-graph {
  display: grid;
  grid-template-columns: auto auto;
  justify-content: space-between;
  align-items: baseline;
  row-gap: 4px;
  width: 168px;
}
.bar-graph .value { font-size: 13px; }
.bar-graph canvas { grid-column: 1 / -1; width: 168px; height: 22px; display: block; }

/* ---------- desk ---------- */
.desk {
  height: var(--desk-h);
  overflow: hidden;
  display: none;
  justify-content: center;
  align-items: center;
  gap: 48px;
  color: var(--dim);
  pointer-events: none;
  opacity: .55;
}
.kbd { display: grid; gap: 9px; font-size: 11px; }
.kbd div { display: flex; justify-content: center; gap: 0; }
.kbd span { width: 21px; text-align: center; transition: color .5s ease, text-shadow .5s ease; }
.kbd span.wide { width: 46px; }
.kbd span.space { width: 160px; border-bottom: 1px solid var(--rule); }
.kbd span.lit { color: var(--accent); text-shadow: 0 0 8px var(--accent); transition: none; }
.mouse { width: 34px; height: 56px; }
.mouse path, .mouse rect { fill: none; stroke: var(--dim); stroke-width: 1; transition: fill .5s ease, stroke .5s ease; }
.mouse .lit { fill: var(--accent); stroke: var(--accent); transition: none; }

.arrive-ring { position: fixed; z-index: 30; border: 1px solid var(--accent); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }
.overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

/* ---------- responsive ---------- */
@media (min-height: 860px) and (min-width: 900px) {
  :root { --desk-h: 190px; }
  .desk { display: flex; }
}
@media (max-width: 1080px) { :root { --eye-w: 150px; --margin: 28px; } }
@media (max-width: 900px) {
  :root { --eye-w: 0px; --wheel-w: 200px; }
  .eye-host { display: none; }
  .den { right: 182px; }
}
@media (max-width: 720px) {
  :root { --margin: 16px; }
  .top { padding-block: 10px 6px; }
  .editor { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .tabline {
    display: flex;
    align-items: center;
    gap: 0;
    width: 100%;
    min-height: 40px;
    padding: 0 10px;
    background: var(--line);
    border: 1px solid var(--rule);
    text-align: left;
  }
  .tab-dir { color: var(--ink); }
  .tab-file { color: var(--ink); flex: 1; }
  .tab-toggle { color: var(--chrome); transition: transform .2s ease; }
  .tabline[aria-expanded="true"] .tab-toggle { transform: rotate(180deg); }
  .wheel {
    display: none;
    position: absolute;
    top: 40px;
    left: 0;
    right: 0;
    z-index: 8;
    border: 1px solid var(--rule);
    border-top: 0;
    background: var(--bg);
    cursor: default;
    padding: 6px;
    touch-action: auto;
  }
  .wheel.is-open { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .wheel .ink, .wheel .pointer, .wheel-foot { display: none; }
  .wheel .card { position: relative; width: auto; transform: none !important; opacity: 1 !important; }
  .pane { padding-left: 0; }
  .winbar { display: none; }
  .buffer { padding-top: 12px; }
  .graph { margin-left: 6px; }
  .eye-host {
    display: block;
    position: absolute;
    top: -52px;
    left: 50%;
    width: 110px;
    padding: 0;
    transform: translateX(-50%);
  }
  .eye-host canvas { height: 46px; }
  .eye-read { display: none; }
  .brand span:last-child { display: none; }
  .bar-graph .label { font-size: 0; }
  .bar-graph .label::before { content: "ACTIVITY"; font-size: 8.5px; letter-spacing: .16em; }
  .bar { grid-template-columns: minmax(0, 1fr) auto; }
  .bar-state, .den { display: none; }
  .bar-graph { width: 110px; }
  .bar-graph canvas { width: 110px; }
}
@media (prefers-reduced-motion: reduce) {
  .caret { animation: none; }
  * { transition-duration: 0s !important; }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <header class="top">
    <a class="brand" href="../index.html" title="back to the intro"><span class="mark" id="mark"></span><span id="domain"></span></a>
    <nav class="elsewhere" id="elsewhere" aria-label="Elsewhere"></nav>
  </header>

  <h1 class="sr-only" id="h1"></h1>

  <section class="editor" aria-label="Editor">
    <button class="tabline" id="tabline" type="button" aria-expanded="false" aria-controls="wheel"><span class="tab-dir">~/Portfolio/</span><span class="tab-file" id="tabfile"></span><span class="tab-toggle" aria-hidden="true">↓</span></button>
    <nav class="wheel" id="wheel" aria-label="Sections">
      <canvas class="ink" id="ink" aria-hidden="true"></canvas>
      <span class="pointer" id="pointer" aria-hidden="true"></span>
      <p class="wheel-foot" aria-hidden="true"><span id="today"></span><span>scroll · drag the wheel</span></p>
    </nav>
    <div class="pane">
      <p class="winbar" id="winbar"></p>
      <div class="buffer" id="buffer" tabindex="0" aria-live="polite"></div>
      <form class="prompt" id="prompt" autocomplete="off">
        <label class="ps1" for="cmd" id="ps1"></label>
        <div class="prompt-row"><span aria-hidden="true">›</span><input id="cmd" name="cmd" spellcheck="false" placeholder="type help"></div>
      </form>
    </div>
    <div class="eye-host" aria-hidden="true">
      <canvas id="eye"></canvas>
      <pre class="eye-read" id="eyeread"></pre>
    </div>
  </section>

  <footer class="bar">
    <p class="bar-id"><span class="bar-title" id="bartitle"></span><span class="bar-sub" id="barsub"></span></p>
    <div class="bar-state" aria-hidden="true">
      <p class="col"><span class="label">Sections</span><span class="value hot" id="v-sections"></span></p>
      <p class="col"><span class="label">Worm</span><span class="value" id="v-worm">lurking</span></p>
      <p class="col"><span class="label">Eye</span><span class="value" id="v-eye">closed</span></p>
      <p class="col"><span class="label">Ghost</span><span class="value" id="v-ghost">idle</span></p>
    </div>
    <button class="den" id="den" type="button" aria-label="Wake the worm" aria-pressed="false" title="wake the worm"></button>
    <p class="bar-graph" aria-hidden="true"><span class="label">Activity · 60 s</span><span class="value hot" id="v-activity">0</span><canvas id="spark"></canvas></p>
  </footer>

  <div class="desk" id="desk" aria-hidden="true"></div>
</main>
<canvas class="overlay" id="overlay" aria-hidden="true"></canvas>

<script src="../content.js"></script>
<script src="../iris.js"></script>
<script>
/* Content lives in ../content.js. Everything here is the machinery. */
const SECTIONS = [
  { id: "about",      kind: "about" },
  { id: "projects",   kind: "projects" },
  { id: "experience", kind: "experience" },
  { id: "stack",      kind: "stack" },
  { id: "log",        kind: "log" },
  { id: "contact",    kind: "contact" },
  { id: "themes",     kind: "themes" },
];


const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
function hashStr(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
function fitCanvas(c, w, h) {

      const mail = el("div", "", `<span class="muted">mail   </span><span class="hot" id="mailaddr">${esc(ME.email)}</span>`);
      const btn = el("button", "copy", "copy"); btn.type = "button";
      btn.addEventListener("click", () => copyText(ME.email, btn));
      mail.append(btn); d.append(mail);
      for (const l of ME.links) d.append(el("div", "", `<span class="muted">${esc(l.label.padEnd(7))}</span><a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.href.replace(/^https?:\/\//, ""))}</a>`));
      d.append(el("div", "", `<span class="muted">where  </span>${esc(ME.location)}`));
      d.append(el("p", "out muted", "\nopen to ML and quant research roles, collaborations and good conversations."));
      return d;
    } }];
  },
  themes() {
    return [{ cmd: "ls themes/", out: () => {
      const w = el("div", "palettes");
      for (const [name, p] of Object.entries(PALETTES)) {
        const b = el("button", "palette"); b.type = "button"; b.setAttribute("aria-pressed", String(C.name === name));
        b.innerHTML = `<div class="sw">${["bg", "line", "dim", "ink", "accent"].map((k) => `<span style="background:${p[k]}"></span>`).join("")}</div>${name}${C.name === name ? " *" : ""}<br><small>${esc(p.note)}</small>`;
        b.addEventListener("click", () => { store.set("bg", ""); applyPalette(name); openSection(SECTIONS[sel]); });
        w.append(b);
      }
      return w;
    } }, { cmd: "bg --pick", out: () => {
      const bg = store.get("bg") || "", row = el("div", "bgrow");
      for (const c of BG_PRESETS) {
        const b = el("button", "bgsw"); b.type = "button"; b.style.background = c; b.setAttribute("aria-label", "background " + c); b.setAttribute("aria-pressed", String(c === bg));
        b.addEventListener("click", () => { store.set("bg", c); applyPalette(C.name); openSection(SECTIONS[sel]); });
        row.append(b);
      }
      const lab = el("label", "bgany", `<input type="color" id="bgPick" value="${bg || C.bg}"><span>any colour</span>`);
      lab.querySelector("input").addEventListener("input", (e) => { store.set("bg", e.target.value); applyPalette(C.name); });
      lab.querySelector("input").addEventListener("change", () => openSection(SECTIONS[sel]));
      const rs = el("button", "copy", "reset"); rs.type = "button";
      rs.addEventListener("click", () => { store.set("bg", ""); applyPalette(C.name); openSection(SECTIONS[sel]); });
      row.append(lab, rs);
      return row;
    } }, { out: out(`<span class="muted">\nor type</span> theme ${Object.keys(PALETTES).join(" | ")} <span class="muted">·</span> bg #1a1024`) }];
  },
};
const WINBAR = {
  about: () => "about/ — README.md",
  projects: () => `projects/ — ${PROJECTS.length} projects`,
  experience: () => `experience/ — ${EXPERIENCE.length} entries`,
  stack: () => `stack/ — ${STACK.reduce((n, g) => n + g.items.length, 0)} tools`,
  log: () => `log/ — ${LOG.length} notes`,
  contact: () => "contact — say hi",
  themes: () => `themes/ — ${Object.keys(PALETTES).length} palettes`,
};
function openSection(s) {
  $("#winbar").textContent = WINBAR[s.kind]();
  $("#tabfile").textContent = s.id + "/";
  try { history.replaceState(null, "", "#" + s.id); } catch {}
  buffer.scrollTop = 0;
  run(RENDER[s.kind]());
}

function copyText(text, btn) {
  const done = () => { btn.textContent = "copied"; setTimeout(() => (btn.textContent = "copy"), 1400); };
  try {
    navigator.clipboard.writeText(text).then(done, () => selectMail());
  } catch { selectMail(); }
  function selectMail() { const n = document.getElementById("mailaddr"); if (!n) return; const r = document.createRange(); r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r); btn.textContent = "selected"; }
}

/* ---------- command prompt ---------- */
const cmdInput = $("#cmd");
const hist = []; let hIdx = 0;
const COMMANDS = {
  help: () => out(`<span class="muted">sections</span>  ${SECTIONS.map((s) => s.id).join("  ")}
<span class="muted">commands</span>  ls · cd &lt;section&gt; · open &lt;project&gt; · whoami · theme &lt;name&gt; · bg &lt;#hex&gt;
          worm · mail · date · clear · help
<span class="muted">keys</span>      ↑↓ section · ←→ entry · ↵ open · : prompt · esc leave`),
  ls: () => out(SECTIONS.map((s) => `<a href="#${s.id}" data-go="${s.id}" style="color:var(--ink);text-decoration:none">${s.id}/</a>`).join("  ")),
  cd: (a) => {
    const name = (a[0] || "about").replace(/[\/~]/g, "").replace(/^\.\.?$/, "about") || "about";
    const i = SECTIONS.findIndex((s) => s.id === name);
    if (i < 0) return out(`cd: no such directory: ${esc(a[0])}`, "out err");
    setTimeout(() => goTo(i), 120); return null;
  },
  open: (a) => {
    const p = PROJECTS.find((p) => p.name === a[0]);
    if (!p) return out(a[0] ? `open: ${esc(a[0])}: no such project` : `usage: open ${PROJECTS.map((p) => p.name).join(" | ")}`, "out err");
    return out(`opening <a href="${esc(p.url)}" target="_blank" rel="noopener" style="color:var(--ink)">${esc(p.url)}</a>`);
  },
  whoami: () => out(`${esc(ME.name)} <span class="muted">— ${esc(ME.role)}</span>`),
  bg: (a) => {
    const v = (a[0] || "").replace(/^#?/, "#");
    if (a[0] === "reset") { store.set("bg", ""); applyPalette(C.name); return out("background reset"); }
    if (!/^#[0-9a-f]{6}$/i.test(v)) return out("usage: bg #1a1024 | bg reset", "out err");
    store.set("bg", v); applyPalette(C.name); return out(`background → ${v}`);
  },
  theme: (a) => {
    if (PALETTES[a[0]]) store.set("bg", "");
    if (!PALETTES[a[0]]) return out(`themes: ${Object.keys(PALETTES).map((k) => k === C.name ? `<span class="hot">${k}</span>` : k).join(" ")}`);
    applyPalette(a[0]); return out(`theme → ${a[0]}`);
  },
  worm: () => { toggleWorm(); return out(worm.state === "lurking" || worm.home ? "the worm goes home." : "the worm is awake. it likes your cursor."); },
  mail: () => { goTo(SECTIONS.findIndex((s) => s.id === "contact")); return null; },
  date: () => out(new Date().toString()),
  echo: (a) => out(esc(a.join(" "))),
  sudo: () => out("nice try.", "out err"),
  exit: () => out("there is no exit. only ~/"),
  clear: () => { buffer.replaceChildren(); return null; },
  github: () => out(`<a href="${esc(ME.links[0].href)}" target="_blank" rel="noopener" style="color:var(--ink)">${esc(ME.links[0].href)}</a>`),
};
$("#prompt").addEventListener("submit", (e) => {
  e.preventDefault();
  const raw = cmdInput.value.trim();
  cmdInput.value = "";
  if (!raw) return;
  hist.push(raw); hIdx = hist.length;
  const [name, ...args] = raw.split(/\s+/);
  const f = COMMANDS[name] || (SECTIONS.some((s) => s.id === name.replace(/\/$/, "")) ? () => COMMANDS.cd([name]) : null);
  runId++; // stop any section that is still typing
  const b = el("div", "block");
  b.append(el("div", "ps1", ps1html()), el("p", "cmdline", esc(raw)));
  buffer.append(b);
  const res = f ? f(args) : out(`zsh: command not found: ${esc(name)}  <span class="muted">(try help)</span>`, "out err");
  if (res) b.append(res);
  buffer.scrollTop = buffer.scrollHeight;
});
cmdInput.addEventListener("keydown", (e) => {
  if (e.key === "ArrowUp" && hist.length) { e.preventDefault(); hIdx = Math.max(0, hIdx - 1); cmdInput.value = hist[hIdx]; }
  else if (e.key === "ArrowDown") { e.preventDefault(); hIdx = Math.min(hist.length, hIdx + 1); cmdInput.value = hist[hIdx] || ""; }
  else if (e.key === "Escape") cmdInput.blur();
  else if (e.key === "Tab") {
    e.preventDefault();
    const [n, a = ""] = cmdInput.value.split(/\s+/);
    const pool = cmdInput.value.includes(" ") ? (n === "open" ? PROJECTS.map((p) => p.name) : n === "theme" ? Object.keys(PALETTES) : SECTIONS.map((s) => s.id)) : [...Object.keys(COMMANDS), ...SECTIONS.map((s) => s.id)];
    const word = cmdInput.value.includes(" ") ? a : n;
    const hit = pool.find((p) => p.startsWith(word));
    if (hit) cmdInput.value = cmdInput.value.includes(" ") ? `${n} ${hit}` : hit;
  }
});

/* ---------- keyboard ---------- */
let focusIdx = -1;
function entries() { return [...buffer.querySelectorAll(".commit, .palette")]; }
document.addEventListener("keydown", (e) => {
  lightKey(e.key);
  tick("key");
  if (e.target === cmdInput || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === ":" || k === "/") { e.preventDefault(); cmdInput.focus(); return; }
  if (k === "ArrowDown" || k === "j") { e.preventDefault(); goTo(target + 1); }
  else if (k === "ArrowUp" || k === "k") { e.preventDefault(); goTo(target - 1); }
  else if (k === "ArrowRight" || k === "ArrowLeft" || k === "l" || k === "h") {
    const list = entries(); if (!list.length) return;
    e.preventDefault();
    focusIdx = clamp(focusIdx + (k === "ArrowRight" || k === "l" ? 1 : -1), 0, list.length - 1);
    list.forEach((n, i) => n.classList.toggle("is-focus", i === focusIdx));
    list[focusIdx].scrollIntoView({ block: "center", behavior: reduced ? "auto" : "smooth" });
  } else if (k === "Enter" && focusIdx >= 0 && document.activeElement === document.body) {
    const n = entries()[focusIdx]; if (n) n.click();
  } else if (k === "Escape") toggleTree(false);
});

/* ---------- ghost / activity ---------- */
let ghostState = "idle", ghostT = 0;
function ghost(s) { ghostState = s; ghostT = performance.now(); }
const act = new Array(60).fill(0); let actTotal = 0, actSec = Math.floor(Date.now() / 1000), lastMoveTick = 0;
function tick(kind) {
  const now = Date.now(), s = Math.floor(now / 1000);
  while (actSec < s) { act.shift(); act.push(0); actSec++; }
  act[59]++; actTotal++;
  if (kind === "key") ghost("typing");
  else if (kind === "scroll") ghost("reading");
}
addEventListener("pointerdown", () => tick("click"));
addEventListener("wheel", () => tick("scroll"), { passive: true });
buffer.addEventListener("scroll", () => { if (performance.now() - lastMoveTick > 120) { lastMoveTick = performance.now(); ghost("reading"); } }, { passive: true });
document.addEventListener("visibilitychange", () => ghost(document.hidden ? "away" : "idle"));
addEventListener("blur", () => ghost("away"));
addEventListener("focus", () => ghost("idle"));

function drawSpark() {
  const c = $("#spark"), w = c.clientWidth, h = c.clientHeight; if (!w) return;
  const s = Math.floor(Date.now() / 1000);
  while (actSec < s) { act.shift(); act.push(0); actSec++; }
  const x = fitCanvas(c, w, h); x.clearRect(0, 0, w, h);
  const n = act.length, bw = w / n, mx = Math.max(6, ...act);
  x.fillStyle = C.dim;
  for (let i = 0; i < n; i++) x.fillRect(i * bw + bw / 2 - .5, h - 1, 1, 1);
  for (let i = 0; i < n; i++) {
    if (!act[i]) continue;
    const v = Math.max(2, (act[i] / mx) * (h - 2));
    x.fillStyle = i === n - 1 ? C.accent : C.ink;
    x.fillRect(i * bw + .5, h - v, Math.max(1, bw - 1), v);
  }
  $("#v-activity").textContent = sep(actTotal);
}

/* ---------- mouse ---------- */
const mouse = { x: innerWidth / 2, y: innerHeight / 2, t: 0 };
addEventListener("pointermove", (e) => {
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.t = performance.now();
  if (performance.now() - lastMoveTick > 250) { lastMoveTick = performance.now(); tick("move"); }
});

/* ---------- the eye ---------- */
// The same iris as the intro. It reads whatever card you hover, follows the
// worm when it's out, and blinks when you change section.
const eyeCanvas = $("#eye"), eyeRead = $("#eyeread");
const eyeText = [ME.name, ME.role, ...PROJECTS.map((p) => p.name + p.desc), ...STACK.flatMap((g) => g.items.map((i) => i[0]))].join("·").replace(/\s+/g, "");
const eye = { state: "closed" };
let iris = null, eyeLast = 0, hoverCard = null;
document.addEventListener("pointerover", (e) => { hoverCard = e.target.closest(".commit, .card, .palette"); });
function blinkEye() { if (iris) iris.blinkAt = performance.now(); }
function drawEye(t) {
  const w = eyeCanvas.clientWidth, h = eyeCanvas.clientHeight; if (!w) return;
  const x = fitCanvas(eyeCanvas, w, h);
  x.clearRect(0, 0, w, h);
  const dt = eyeLast ? Math.min(.05, (t - eyeLast) / 1000) : 1 / 60;
  eyeLast = t;
  if (!iris) { iris = Iris.create(w / 2, h / 2, w, h); iris.open = false; }
  iris.cx = w / 2; iris.cy = h / 2; iris.w = w * .98; iris.h = Math.min(h * .95, w * .62);
  const r = eyeCanvas.getBoundingClientRect();
  let focus = null;
  if (worm.state !== "lurking") { focus = { x: worm.seg[0].x - r.left, y: worm.seg[0].y - r.top, kind: "worm" }; eye.state = "on worm"; }
  else if (hoverCard && hoverCard.isConnected && t - mouse.t < 4000) { const b = hoverCard.getBoundingClientRect(); focus = { x: b.left + b.width / 2 - r.left, y: b.top + b.height / 2 - r.top, kind: "card" }; eye.state = "reading"; }
  else if (mouse.t && t - mouse.t < 5000) { focus = { x: mouse.x - r.left, y: mouse.y - r.top, kind: "pointer" }; eye.state = "tracking"; }
  else eye.state = "drifting";
  iris.open = !(document.hidden || ghostState === "away") && t > (arrived ? 1300 : 600);
  iris.dilate = focus?.kind === "card" ? .85 : null;
  Iris.update(iris, t, dt, focus, reduced);
  if (iris.openNow < .1) eye.state = iris.open ? "blinking" : "closed";
  const small = w < 130;
  Iris.draw(x, iris, t, eyeText, { ink: C.ink, accent: C.accent, bg: C.bg }, { font: small ? 3.4 : 5 });
  if (!small) {
    const p = iris.p;
    eyeRead.textContent = `['iris:u'] ${((p.x - iris.cx + iris.w / 2) / iris.w).toFixed(7)}\n['pupil']  ${(p.rp / p.ri).toFixed(7)}\n['lid']    ${iris.openNow.toFixed(4)}\n['focus']  ${hoverCard && eye.state === "reading" ? (hoverCard.querySelector(".name, .lbl")?.textContent || "").trim().slice(0, 16) : SECTIONS[sel].id + "/"}`;
  }
}

/* ---------- arriving through the pupil ---------- */
let arrived = false;
(function arrive() {
  let a = null;
  try { a = JSON.parse(sessionStorage.getItem("arrive")); sessionStorage.removeItem("arrive"); } catch {}
  if (!a || reduced || !document.body.animate) return;
  arrived = true;
  const at = `${(a.x * 100).toFixed(1)}% ${(a.y * 100).toFixed(1)}%`, curve = "cubic-bezier(.7,0,.2,1)";
  $("#stage").animate([{ clipPath: `circle(0px at ${at})` }, { clipPath: `circle(150% at ${at})` }], { duration: 1150, easing: curve });
  const ring = document.createElement("div");
  ring.className = "arrive-ring";
  ring.style.left = (a.x * 100) + "%"; ring.style.top = (a.y * 100) + "%";
  document.body.append(ring);
  ring.animate([{ width: "0px", height: "0px", opacity: 1 }, { width: "300vmax", height: "300vmax", opacity: 0 }], { duration: 1150, easing: curve }).onfinish = () => ring.remove();
})();

/* ---------- the worm ---------- */
const ov = $("#overlay");
const worm = { state: "lurking", home: false, seg: [], heading: -Math.PI / 2, wanderT: 0, goal: null, idleSince: 0 };
function denXY() { const r = $("#den").getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function toggleWorm() {
  const d = denXY();
  if (worm.state === "lurking") {
    worm.seg = Array.from({ length: 30 }, () => ({ x: d.x, y: d.y }));
    worm.heading = -Math.PI / 2; worm.state = "awake"; worm.home = false; worm.idleSince = performance.now();
  } else worm.home = true;
  $("#den").setAttribute("aria-pressed", String(!worm.home && worm.state !== "lurking"));
}
$("#den").addEventListener("click", toggleWorm);
function stepWorm(t) {
  const x = fitCanvas(ov, innerWidth, innerHeight);
  x.clearRect(0, 0, innerWidth, innerHeight);
  if (worm.state === "lurking") return;
  const head = worm.seg[0];
  let goal;
  if (worm.home) { goal = denXY(); worm.state = "going home"; }
  else if (t - mouse.t < 2500) { goal = mouse; worm.state = "hunting"; worm.idleSince = t; }
  else {
    if (!worm.goal || t > worm.wanderT || Math.hypot(worm.goal.x - head.x, worm.goal.y - head.y) < 20) { worm.goal = { x: 40 + Math.random() * (innerWidth - 80), y: 60 + Math.random() * (innerHeight - 120) }; worm.wanderT = t + 4000; }
    goal = worm.goal; worm.state = t - worm.idleSince > 30000 ? "asleep" : "wandering";
  }
  const dist = Math.hypot(goal.x - head.x, goal.y - head.y);
  if (worm.state !== "asleep") {
    const want = Math.atan2(goal.y - head.y, goal.x - head.x);
    let da = want - worm.heading; da = Math.atan2(Math.sin(da), Math.cos(da));
    worm.heading += clamp(da, -.09, .09) + Math.sin(t * .012) * .06;
    const sp = dist < 14 ? dist * .1 : (worm.state === "hunting" ? 2.8 : 1.8);
    head.x += Math.cos(worm.heading) * sp; head.y += Math.sin(worm.heading) * sp;
  }
  for (let i = 1; i < worm.seg.length; i++) {
    const a = worm.seg[i - 1], b = worm.seg[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1, L = 5.2;
    if (d > L) { b.x = a.x + dx / d * L; b.y = a.y + dy / d * L; }
  }
  if (worm.home && dist < 6) { worm.state = "lurking"; worm.home = false; $("#den").setAttribute("aria-pressed", "false"); return; }
  const n = worm.seg.length;
  for (let i = n - 1; i >= 0; i--) {
    const s = worm.seg[i], k = 1 - i / n, rad = 1.2 + Math.sin(k * Math.PI) * 4.2 + (i === 0 ? 1 : 0);
    x.fillStyle = `rgba(${C.worm}, ${.35 + k * .65})`;
    x.beginPath(); x.arc(s.x, s.y, rad, 0, 7); x.fill();
  }
  const ex = Math.cos(worm.heading), ey = Math.sin(worm.heading);
  x.fillStyle = C.bg;
  for (const side of [-1, 1]) { x.beginPath(); x.arc(head.x + ex * 2 - ey * side * 2.4, head.y + ey * 2 + ex * side * 2.4, 1.1, 0, 7); x.fill(); }
}

/* ---------- desk ---------- */
const desk = $("#desk");
const ROWS = [["esc", "`", "1", "2", "3", "4", "5", "6", "7", "8", "9", "0", "-", "=", "⌫"], ["q", "w", "e", "r", "t", "y", "u", "i", "o", "p", "[", "]", "\\"], ["a", "s", "d", "f", "g", "h", "j", "k", "l", ";", "'", "↵"], ["⇧", "z", "x", "c", "v", "b", "n", "m", ",", ".", "/", "↑"], ["←", "space", "↓", "→"]];
const KEYMAP = { Escape: "esc", Backspace: "⌫", Enter: "↵", Shift: "⇧", ArrowUp: "↑", ArrowDown: "↓", ArrowLeft: "←", ArrowRight: "→", " ": "space" };
const keyEls = {};
const kbd = el("div", "kbd");
for (const row of ROWS) {
  const r = el("div");
  for (const k of row) { const s = el("span", k === "space" ? "space" : k.length > 1 ? "wide" : "", k === "space" ? "" : esc(k)); keyEls[k] = s; r.append(s); }
  kbd.append(r);
}
desk.append(kbd);
desk.insertAdjacentHTML("beforeend", `<svg class="mouse" viewBox="0 0 34 56"><path id="m-l" d="M17 1 C8 1 1 7 1 17 V20 H17 Z"/><path id="m-r" d="M17 1 C26 1 33 7 33 17 V20 H17 Z"/><path d="M1 20 V38 C1 49 8 55 17 55 C26 55 33 49 33 38 V20"/><rect id="m-w" x="15" y="7" width="4" height="8" rx="2"/></svg>`);
function flash(n) { if (!n) return; n.classList.add("lit"); clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove("lit"), 90); }
function lightKey(key) { flash(keyEls[KEYMAP[key] || key.toLowerCase()]); }
addEventListener("pointerdown", (e) => flash(document.getElementById(e.button === 2 ? "m-r" : "m-l")));
addEventListener("wheel", () => flash(document.getElementById("m-w")), { passive: true });

/* ---------- loop ---------- */
const stateEls = { worm: $("#v-worm"), eye: $("#v-eye"), ghost: $("#v-ghost") };
let frame = 0;
function loop(t) {
  frame++;
  if (!document.hidden) {
    const k = reduced ? 1 : .16;
    pos += (target - pos) * (drag && drag.moved ? 0 : k);
    if (Math.abs(target - pos) < .001) pos = target;
    layoutWheel(t);
    if (frame % 2 === 0 && getComputedStyle(eyeCanvas.parentElement).display !== "none") drawEye(t);
    stepWorm(t);
    if (frame % 20 === 0) {
      drawSpark();
      if (ghostState !== "away" && t - ghostT > 2200) ghostState = "idle";
      stateEls.worm.textContent = worm.state;
      stateEls.eye.textContent = eye.state;
      stateEls.ghost.textContent = ghostState;
    }
  }
  requestAnimationFrame(loop);
}

/* ---------- boot ---------- */
applyPalette(store.get("palette") || "dusk");
addEventListener("resize", () => { setHints(); drawAllThumbs(); });
const start = SECTIONS.findIndex((s) => s.id === location.hash.slice(1));
goTo(start >= 0 ? start : 1, true);
addEventListener("hashchange", () => { const i = SECTIONS.findIndex((s) => s.id === location.hash.slice(1)); if (i >= 0) goTo(i); });
document.fonts && document.fonts.ready.then(drawAllThumbs);
requestAnimationFrame(loop);
</script>
</body>
