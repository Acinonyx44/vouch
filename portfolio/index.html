<html lang="en">
<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: a vim window in the middle of a dark room. Shell line → buffer →
   statusline → cmdline, a keyboard with two typing hands underneath, and a
   footer with the way in. Palettes are shared with the editor (site/). */
:root {
  --bg: #0b0a0d;
  --ink: #dcd4cd;
  --chrome: #a29b96;
  --dim: #77807c;
  --rule: #34302f;
  --line: #19171b;
  --accent: #ff3d9a;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --display: "Archivo", system-ui, sans-serif;
  --wide: 800px;
  --margin: 40px;
  --lh: 13px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 12px/var(--lh) var(--mono);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  transition: background-color .4s ease, color .4s ease;
}
a, button { color: inherit; font: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
::selection { background: var(--accent); color: var(--bg); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.stage {
  position: relative;
  height: 100%;
  min-height: 480px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto auto auto;
  padding-inline: var(--margin);
  transition: opacity .28s ease;
}
.stage.is-leaving > :not(.vim) { opacity: 0; transition: opacity .35s ease; }
.stage.is-leaving .minimap, .stage.is-leaving .eye-read { opacity: 0; transition: opacity .35s ease; }
.top, .vim, .status, .cmdline, .desk, .foot { width: 100%; max-width: var(--wide); margin-inline: auto; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 22px 18px; font-size: 12.5px; }
.brand { display: inline-flex; align-items: center; gap: 10px; min-height: 40px; text-decoration: none; color: var(--ink); }
.mark { font: 800 15px/1 var(--display); font-stretch: 62%; letter-spacing: -.04em; padding: 2px 3px 1px; border: 1.5px solid currentColor; border-radius: 1px; }
.elsewhere { display: flex; gap: 18px; }
.elsewhere a { color: var(--chrome); text-decoration: none; min-height: 40px; display: inline-flex; align-items: center; }
.elsewhere a:hover { color: var(--ink); }

/* ---------- the buffer ---------- */
.vim { position: relative; min-height: 0; }
.code {
  height: 100%;
  overflow: hidden;
  padding-top: 18px;
  color: var(--chrome);
  transition: opacity .35s ease;
}
.code.is-closing { opacity: 0; }
.shell { margin: 0; color: var(--chrome); white-space: pre; }
.shell .p { color: var(--dim); }
.hdr { color: var(--dim); white-space: pre; overflow: hidden; text-overflow: ellipsis; margin-bottom: var(--lh); }
.line {
  display: grid;
  grid-template-columns: 4ch minmax(0, 1fr);
  min-height: var(--lh);
  cursor: text;
  animation: rise .32s ease both;
}
@keyframes rise { from { opacity: 0; transform: translateY(3px); } }
.num { text-align: right; padding-right: 1ch; color: var(--dim); font-variant-numeric: tabular-nums; }
.txt { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.line.cur { background: var(--line); }
.line.cur .num { color: var(--ink); }
.line.glitch .txt { background: color-mix(in srgb, var(--ink) 9%, transparent); color: var(--ink); }
.cursor { background: var(--ink); color: var(--bg); }
.is-insert .cursor { background: none; color: inherit; box-shadow: inset 2px 0 0 var(--accent); }
.shell .cursor { animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.k, .f { color: var(--ink); }
.s, .c { color: var(--dim); }
.c { font-style: italic; }
.n { color: var(--accent); }
.t { color: var(--ink); opacity: .8; }
.p { color: var(--dim); }
.typed { color: var(--ink); outline: 1px solid var(--chrome); outline-offset: 1px; }

.code { padding-right: 70px; }
.iris { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.eye-read { position: absolute; z-index: 3; margin: 0; font-size: 9px; line-height: 1.2; color: var(--chrome); white-space: pre; pointer-events: none; font-variant-numeric: tabular-nums; }
.minimap { position: absolute; right: 0; top: 18px; width: 58px; height: calc(100% - 18px); cursor: pointer; z-index: 1; }
.num { transition: box-shadow .6s ease; }
.warp { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }

.status, .cmdline {
  display: flex;
  height: var(--lh);
  margin-block: 0;
  white-space: nowrap;
  overflow: hidden;
  opacity: 0;
  transition: opacity .32s ease;
}
.status.is-on, .cmdline.is-on { opacity: 1; }
.status { background: var(--line); color: var(--chrome); }
.status .mode { padding: 0 1ch; background: var(--ink); color: var(--bg); }
.status.is-insert .mode { background: var(--accent); }
.status .path { flex: 1; min-width: 0; padding: 0 1ch; overflow: hidden; text-overflow: ellipsis; }
.status .pos { padding: 0 1ch; font-variant-numeric: tabular-nums; }
.cmdline { color: var(--ink); }
.cmdline .cmd { flex: 1; min-width: 0; overflow: hidden; white-space: pre; }
.cmdline.is-typing .cmd::after { content: ""; display: inline-block; width: 1ch; height: var(--lh); vertical-align: top; background: var(--ink); }
.cmdline .showcmd { width: 11ch; color: var(--chrome); }
.cmdline .msg { color: var(--chrome); }
.cmdline .err { color: var(--accent); }

/* ---------- desk ---------- */
.desk { display: none; justify-content: center; padding-top: 22px; pointer-events: none; }
.glass {
  position: relative;
  width: min(580px, 100%);
  height: 208px;
  background: color-mix(in srgb, var(--line) 65%, transparent);
}
.kbd { position: absolute; left: 0; right: 0; top: 22px; display: grid; gap: 13px; color: var(--dim); opacity: .7; font-size: 11.5px; line-height: 1; }
.kbd div { display: flex; justify-content: center; }
.kbd span { width: 21.5px; text-align: center; transition: color .5s ease, text-shadow .5s ease; }
.kbd span.wide { width: 40px; }
.kbd span.space { width: 150px; height: 1px; margin-top: 6px; background: var(--rule); }
.kbd span.lit { color: var(--accent); text-shadow: 0 0 8px var(--accent); transition: none; }
.kbd span.space.lit { background: var(--accent); }
.hands { position: absolute; inset: 0; width: 100%; height: 100%; }

.actions { position: relative; }
.picker {
  position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 12;
  width: min(330px, calc(100vw - 32px)); padding: 12px;
  background: var(--line); border: 1px solid var(--rule);
  display: grid; gap: 8px;
}
.picker[hidden] { display: none; }
.pk-h { margin: 0; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.pk-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pk-pal { display: inline-flex; align-items: center; gap: 6px; padding: 3px 7px 3px 3px; border: 1px solid var(--rule); color: var(--chrome); }
.pk-pal i { width: 18px; height: 14px; border: 1px solid var(--rule); }
.pk-pal[aria-pressed="true"], .pk-pal:hover { border-color: var(--ink); color: var(--ink); }
.pk-sw { width: 24px; height: 24px; border: 1px solid var(--rule); }
.pk-sw[aria-pressed="true"], .pk-sw:hover { outline: 1px solid var(--ink); outline-offset: 2px; }
.pk-any { display: inline-flex; align-items: center; gap: 4px; color: var(--chrome); cursor: pointer; }
.pk-any input { width: 26px; height: 26px; padding: 0; border: 1px solid var(--rule); background: none; cursor: pointer; }
.pk-reset { color: var(--dim); padding: 0 4px; }
.pk-reset:hover { color: var(--ink); }
.foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 16px 22px; }
.note { margin: 0; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; align-items: center; gap: 16px; flex: none; }
.theme-key { color: var(--chrome); min-height: 32px; }
.theme-key:hover { color: var(--ink); }
.theme-key b { font-weight: 500; color: var(--ink); margin-right: .6ch; }
.enter { display: inline-flex; align-items: center; min-height: 18px; padding: 1px 8px; background: var(--ink); color: var(--bg); text-decoration: none; }
.enter:hover { background: var(--accent); }

.overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

@media (min-height: 720px) { .desk { display: flex; } }
@media (max-width: 960px) { .eye-read { display: none; } .eye { right: 0; } }
@media (max-width: 720px) {
  :root { --margin: 16px; }
  .top { padding-block: 10px 6px; }
  .eye, .eye-read { display: none; }
  .glass { height: 190px; }
  .kbd { font-size: 10.5px; }
  .kbd span { width: 20px; }
  .kbd span.wide { width: 30px; }
  .kbd span.space { width: 120px; }
}
@media (prefers-reduced-motion: reduce) {
  .line { animation: none; }
  .shell .cursor { animation: none; }
  * { transition-duration: 0s !important; }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <header class="top">
    <a class="brand" href="./"><span class="mark" id="mark"></span><span id="domain"></span></a>
    <nav class="elsewhere" id="elsewhere" aria-label="Elsewhere"></nav>
  </header>

  <h1 class="sr-only" id="h1"></h1>

  <section class="vim" id="vim" aria-hidden="true">
    <div class="code" id="code"></div>
    <canvas class="minimap" id="minimap" aria-hidden="true"></canvas>
    <canvas class="iris" id="iris"></canvas>
    <pre class="eye-read" id="eyeread" hidden></pre>
  </section>
  <p class="status" id="status" aria-hidden="true"><span class="mode">NORMAL</span><span class="path"></span><span class="pos"></span></p>
  <p class="cmdline" id="cmdline" aria-hidden="true"><span class="cmd"></span><span class="showcmd"></span></p>

  <div class="desk" aria-hidden="true">
    <div class="glass" id="glass"><div class="kbd" id="kbd"></div><canvas class="hands" id="hands"></canvas></div>
  </div>

  <footer class="foot">
    <p class="note" id="note"></p>
    <div class="actions">
      <button class="theme-key" id="themeKey" type="button" aria-label="Change theme and background" aria-expanded="false" aria-controls="picker"><b>›_</b>:theme</button>
      <div class="picker" id="picker" hidden></div>
      <a class="enter" id="enter" href="site/index.html">enter ↩</a>
    </div>
  </footer>
</main>
<canvas class="overlay" id="overlay" aria-hidden="true"></canvas>
<canvas class="warp" id="warp" aria-hidden="true"></canvas>

<script src="content.js"></script>
<script src="code.js"></script>
<script src="iris.js"></script>
<script>
/* Content lives in content.js and code.js. Everything here is the machinery. */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DPR = Math.min(2, window.devicePixelRatio || 1);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
function fitCanvas(c, w, h) {
  if (c.width !== Math.round(w * DPR) || c.height !== Math.round(h * DPR)) { c.width = Math.round(w * DPR); c.height = Math.round(h * DPR); }
  const x = c.getContext("2d"); x.setTransform(DPR, 0, 0, DPR, 0, 0); return x;
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

/* ---------- chrome + palette ---------- */
$("#mark").textContent = ME.initials;
$("#domain").textContent = ME.domain;
$("#h1").textContent = `${ME.name}: ${ME.tagline}`;
for (const l of ME.links.slice(0, 2)) { const a = document.createElement("a"); a.href = l.href; a.textContent = l.label; a.rel = "me noopener"; a.target = "_blank"; $("#elsewhere").append(a); }
const tagline = `// ${ME.tagline}`;
$("#note").textContent = tagline;

let C = {};
const PNAMES = Object.keys(PALETTES);
function applyPalette(name) {
  const p = withBg(PALETTES[name] || PALETTES.dusk, store.get("bg")), r = document.documentElement.style;
  for (const k of ["bg", "ink", "chrome", "dim", "rule", "line", "accent"]) r.setProperty("--" + k, p[k]);
  r.setProperty("color-scheme", p.scheme);
  C = { ...p, name: PALETTES[name] ? name : "dusk" };
  store.set("palette", C.name);
  if (typeof renderPicker === "function") renderPicker();
}
function setBg(hex) {
  store.set("bg", hex || "");
  applyPalette(C.name);
}
const nextPalette = () => PNAMES[(PNAMES.indexOf(C.name) + 1) % PNAMES.length];
applyPalette(store.get("palette") || "dusk");

/* ---------- tokenizer ---------- */
const KW = {
  js: new Set("import from export default const let var function return if else for while async await new class extends static of in typeof try catch throw null true false undefined this".split(" ")),
  py: new Set("from import def return if elif else for while in not and or is None True False class with as try except raise lambda async await".split(" ")),
};
function tokenize(text, lang, state) {
  const toks = [], n = text.length;
  let i = 0;
  const push = (cls, s) => { if (s) toks.push([cls, s]); };
  while (i < n) {
    if (state) {
      const end = text.indexOf(state.close, i);
      if (end < 0) { push(state.cls, text.slice(i)); return { toks, state }; }
      push(state.cls, text.slice(i, end + state.close.length)); i = end + state.close.length; state = null; continue;
    }
    const rest = text.slice(i), ch = text[i];
    if ((lang === "py" && ch === "#") || (lang === "js" && rest.startsWith("//"))) { push("c", rest); break; }
    if (lang === "js" && rest.startsWith("/*")) { state = { close: "*/", cls: "c" }; continue; }
    if (lang === "py" && (rest.startsWith('"""') || rest.startsWith("'''"))) { const q = rest.slice(0, 3); push("s", q); i += 3; state = { close: q, cls: "s" }; continue; }
    if (ch === '"' || ch === "'" || ch === "`") {
      let j = i + 1;
      while (j < n && text[j] !== ch) j += text[j] === "\\" ? 2 : 1;
      if (j >= n && ch === "`") { push("s", rest); return { toks, state: { close: "`", cls: "s" } }; }
      push("s", text.slice(i, j + 1)); i = j + 1; continue;
    }
    let m;
    if ((m = /^\d+(\.\d+)?/.exec(rest)) && !/[\w$]/.test(text[i - 1] || "")) { push("n", m[0]); i += m[0].length; continue; }
    if ((m = /^[A-Za-z_$][\w$]*/.exec(rest))) {
      const w = m[0], after = text.slice(i + w.length).trimStart()[0];
      push(KW[lang].has(w) ? "k" : after === "(" ? "f" : /^[A-Z]/.test(w) ? "t" : "", w);
      i += w.length; continue;
    }
    if ((m = /^\s+/.exec(rest))) { push("", m[0]); i += m[0].length; continue; }
    m = /^[^\w\s"'`$#]+/.exec(rest);
    const p = m ? m[0] : ch;
    push("p", p); i += p.length;
  }
  return { toks, state };
}

/* ---------- vim state ---------- */
const code = $("#code"), vim = $("#vim"), statusEl = $("#status"), cmdEl = $("#cmdline");
const cmdText = cmdEl.querySelector(".cmd"), showcmd = cmdEl.querySelector(".showcmd");
let file = null, lines = [], rows = [], cur = { r: 0, c: 0 }, mode = "shell", cmdBuf = "", keyTrail = "", pendingG = false, cmdByAuto = false;
const scrambles = new Map();
const GLYPHS = "░▒▓/\\<>+=*#%&$0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";

function retokenize(from = 0) {
  let state = from > 0 ? lines[from - 1].end : null;
  for (let i = from; i < lines.length; i++) { const t = tokenize(lines[i].text, file.lang, state); lines[i].toks = t.toks; lines[i].end = state = t.state; }
}
function lineHTML(i) {
  const L = lines[i], cc = i === cur.r && mode !== "shell" ? cur.c : -1, scr = scrambles.get(i);
  let html = "", col = 0;
  const now = performance.now();
  for (const [cls, str] of L.toks) {
    let o = "";
    for (const ch0 of str) {
      let ch = ch0;
      if (scr && ch0 !== " " && scrambled(scr, col, now)) ch = GLYPHS[(Math.random() * GLYPHS.length) | 0];
      o += col === cc ? `<span class="cursor">${esc(ch)}</span>` : esc(ch);
      col++;
    }
    html += cls ? `<span class="${cls}">${o}</span>` : o;
  }
  if (cc >= col) html += `<span class="cursor"> </span>`;
  return html;
}
function scrambled(s, col, now) {
  const p = (now - s.t0) / s.dur, h = ((col * 2654435761) >>> 0) / 4294967296;
  if (p < .35) return h < p / .35;
  return h > (p - .35) / .65;
}
function paint(i) { if (rows[i]) rows[i].txt.innerHTML = lineHTML(i); }

let lastFile = null;
function openFile(f) {
  file = lastFile = f;
  heat = [];
  lines = f.text.split("\n").map((text) => ({ text }));
  retokenize();
  code.classList.remove("is-closing");
  code.replaceChildren();
  const hdr = document.createElement("div");
  hdr.className = "hdr";
  hdr.textContent = `${f.lang === "py" ? "#" : "//"} ── ${f.path} ──`;
  code.append(hdr);
  rows = lines.map((_, i) => {
    const row = document.createElement("div"); row.className = "line"; row.dataset.i = i;
    if (!reduced) row.style.animationDelay = Math.min(i, 40) * 12 + "ms";
    const num = document.createElement("span"); num.className = "num"; num.textContent = i + 1;
    const txt = document.createElement("span"); txt.className = "txt";
    row.append(num, txt); code.append(row);
    return { row, num, txt };
  });
  mode = "normal";
  cur = { r: 0, c: 0 };
  lines.forEach((_, i) => paint(i));
  rows[0].row.classList.add("cur");
  code.scrollTop = 0;
  statusEl.querySelector(".path").textContent = "~/Projects/" + f.path;
  statusEl.classList.add("is-on"); statusEl.classList.remove("is-insert");
  statusEl.querySelector(".mode").textContent = "NORMAL";
  cmdEl.classList.add("is-on");
  setCmd("");
  updatePos();
}
function closeFile() {
  file = null; mode = "shell"; scrambles.clear();
  code.classList.add("is-closing");
  statusEl.classList.remove("is-on"); cmdEl.classList.remove("is-on");
  if (eyeE) eyeE.open = false;
  $("#note").textContent = tagline;
  if (reduced) setTimeout(() => openFile(CODE[(CODE.indexOf(lastFile) + 1) % CODE.length]), 400);
}
function shellLine(text, caret = true) {
  code.classList.remove("is-closing");
  code.innerHTML = `<p class="shell"><span class="p">~ ›</span> ${esc(text)}${caret ? '<span class="cursor"> </span>' : ""}</p>`;
}

function setCursor(r, c, keepCol) {
  if (!file) return;
  const old = cur.r;
  r = clamp(r, 0, lines.length - 1);
  const len = lines[r].text.length;
  c = clamp(c, 0, Math.max(0, mode === "insert" ? len : len - 1));
  cur = { r, c, want: keepCol ? cur.want ?? cur.c : c };
  if (old !== r && rows[old]) { rows[old].row.classList.remove("cur"); paint(old); }
  rows[r].row.classList.add("cur");
  paint(r);
  scrollToCursor();
  updatePos();
}
function scrollToCursor() {
  const row = rows[cur.r].row, top = row.offsetTop - code.offsetTop, h = code.clientHeight, lh = row.offsetHeight;
  const pad = 4 * 13;
  let st = code.scrollTop;
  if (top - pad < st) st = Math.max(0, top - pad);
  else if (top + lh + pad > st + h) st = top + lh + pad - h;
  if (st !== code.scrollTop) code.scrollTo({ top: st, behavior: reduced ? "auto" : "smooth" });
}
function updatePos() {
  if (!file) return;
  const max = code.scrollHeight - code.clientHeight, st = code.scrollTop;
  const where = max <= 2 ? "All" : st <= 2 ? "Top" : st >= max - 2 ? "Bot" : Math.round((st / max) * 100) + "%";
  statusEl.querySelector(".pos").textContent = `${cur.r + 1}:${cur.c + 1}  ${where}`;
}
code.addEventListener("scroll", updatePos, { passive: true });
function setMode(m) {
  mode = m;
  statusEl.classList.toggle("is-insert", m === "insert");
  vim.classList.toggle("is-insert", m === "insert");
  statusEl.querySelector(".mode").textContent = m === "insert" ? "INSERT" : "NORMAL";
  if (m === "insert") setCmd('<span class="msg">-- INSERT --</span>', true);
  else if (m === "normal") setCmd("");
  paint(cur.r);
}
function setCmd(html, raw) {
  cmdText.innerHTML = raw ? html : esc(html);
  cmdEl.classList.toggle("is-typing", mode === "cmd");
}
function scramble(i, dur = 2600) {
  if (!file || reduced) return;
  scrambles.set(i, { t0: performance.now(), dur });
  rows[i].row.classList.add("glitch");
}
setInterval(() => {

  leaving = true;
  const href = $("#enter").getAttribute("href");
  if (reduced) { location.href = href; return; }
  if (mode === "cmd" || mode === "insert") { mode = "normal"; setCmd(""); }
  $("#stage").classList.add("is-leaving");
  const r = vimRect();
  if (!eyeE) openEye({ x: r.left + r.width / 2, y: r.top + clamp(r.height * .42, 110, r.height - 110) });
  const e = eyeE;
  e.open = true; e.dilate = .95; e.spinBoost = 2.2; e.closeAt = Infinity;
  for (let k = 0; k < 40 && e.lid.v < .97; k++) await sleep(30);
  const ox = r.left + e.p.x, oy = r.top + e.p.y;
  const parts = collectGlyphs(e, r);
  code.style.visibility = "hidden";
  await swallow(parts, ox, oy);
  await dive(ox, oy, e.p.rp);
  try { sessionStorage.setItem("arrive", JSON.stringify({ x: ox / innerWidth, y: oy / innerHeight })); } catch {}
  location.href = href;
}
// every visible character, where it sits on screen
function collectGlyphs(e, vr) {
  const out = [], cr = code.getBoundingClientRect();
  const m = warp.getContext("2d"); m.font = "12px 'IBM Plex Mono', monospace";
  const cw = m.measureText("M").width || 7.2;
  const nodes = file ? rows.map((R) => R.txt) : [...code.querySelectorAll(".shell")];
  for (const node of nodes) {
    const tr = node.getBoundingClientRect();
    if (tr.bottom < cr.top || tr.top > cr.bottom) continue;
    const text = node.textContent, per = Math.max(1, Math.floor(tr.width / cw));
    for (let i = 0; i < text.length; i++) {
      if (text[i] === " ") continue;
      const x = tr.left + (i % per) * cw, y = tr.top + Math.floor(i / per) * 13 + 6.5;
      if (y > cr.bottom || y < cr.top) continue;
      if (Math.abs(x - vr.left - e.cx) < e.w * .46 && Math.abs(y - vr.top - e.cy) < e.h * .4) continue;
      out.push({ ch: text[i], x, y });
    }
  }
  while (out.length > 3600) out.splice((Math.random() * out.length) | 0, 1);
  return out;
}
// the code spirals into the pupil, nearest first
function swallow(parts, ox, oy) {
  return new Promise((done) => {
    const W = innerWidth, H = innerHeight, far = Math.hypot(W, H) * .6, t0 = performance.now();
    for (const p of parts) {
      const dx = p.x - ox, dy = p.y - oy;
      p.r0 = Math.hypot(dx, dy); p.a0 = Math.atan2(dy, dx);
      p.delay = (p.r0 / far) * .5 + Math.random() * .12;
      p.dur = .5 + Math.random() * .3;
    }
    (function frame(now) {
      const x = fitCanvas(warp, W, H), T = (now - t0) / 1000;
      x.clearRect(0, 0, W, H);
      x.font = "12px 'IBM Plex Mono', monospace"; x.textBaseline = "middle"; x.fillStyle = C.ink;
      let live = 0;
      for (const p of parts) {
        const u = clamp((T - p.delay) / p.dur, 0, 1);
        if (u >= 1) continue;
        live++;
        const k = u * u * u, rad = p.r0 * (1 - k), a = p.a0 + 1.7 * k;
        x.globalAlpha = (1 - k) * .85;
        x.fillText(p.ch, ox + Math.cos(a) * rad, oy + Math.sin(a) * rad);
      }
      x.globalAlpha = 1;
      if (live && T < 2.2) requestAnimationFrame(frame); else { x.clearRect(0, 0, W, H); done(); }
    })(t0);
  });
}
// then the pupil opens until it is the whole room
function dive(ox, oy, r0) {
  return new Promise((done) => {
    const W = innerWidth, H = innerHeight, far = Math.hypot(Math.max(ox, W - ox), Math.max(oy, H - oy)) + 60;
    const streaks = Array.from({ length: 360 }, () => ({ a: Math.random() * Math.PI * 2, k: Math.random(), len: 8 + Math.random() * 50, hot: Math.random() < .3 }));
    const t0 = performance.now(), ms = 950;
    (function frame(now) {
      const x = fitCanvas(warp, W, H), u = clamp((now - t0) / ms, 0, 1);
      const e = u < .5 ? 4 * u * u * u : 1 - (-2 * u + 2) ** 3 / 2, R = r0 + (far - r0) * e;
      x.clearRect(0, 0, W, H);
      x.lineWidth = 1;
      for (const s of streaks) {
        const d = R + 6 + s.k * (80 + 240 * u), L = s.len * (1 + u * 4);
        x.strokeStyle = s.hot ? C.accent : C.ink;
        x.globalAlpha = (1 - u) * (.25 + .6 * (1 - s.k));
        x.beginPath(); x.moveTo(ox + Math.cos(s.a) * d, oy + Math.sin(s.a) * d); x.lineTo(ox + Math.cos(s.a) * (d + L), oy + Math.sin(s.a) * (d + L)); x.stroke();
      }
      x.globalAlpha = 1;
      x.fillStyle = C.bg;
      x.beginPath(); x.arc(ox, oy, R, 0, Math.PI * 2); x.fill();
      for (const [w, a] of [[10, .06], [4, .15], [1.5, .7]]) { x.lineWidth = w; x.strokeStyle = rgba(C.accent, a * (1 - u * .6)); x.beginPath(); x.arc(ox, oy, R, 0, Math.PI * 2); x.stroke(); }
      if (u < 1) requestAnimationFrame(frame); else done();
    })(t0);
  });
}

/* ---------- minimap + where the cursor has been ---------- */
let heat = [];
function drawMini() {
  if (!file || !mini.offsetParent) return;
  const w = mini.clientWidth, h = mini.clientHeight, x = fitCanvas(mini, w, h);
  x.clearRect(0, 0, w, h);
  const lh = Math.min(3, h / lines.length), sx = .7;
  lines.forEach((L, i) => {
    let col = 0;
    for (const [cls, s] of L.toks) {
      if (s.trim()) { x.fillStyle = cls === "n" ? C.accent : rgba(C.ink, cls === "k" || cls === "f" ? .5 : .2); x.fillRect(6 + col * sx, i * lh, s.length * sx, Math.max(1, lh - 1)); }
      col += s.length;
    }
    if (heat[i]) { x.fillStyle = rgba(C.accent, Math.min(.9, heat[i] / 6)); x.fillRect(0, i * lh, 2, Math.max(1, lh - .5)); }
  });
  const sh = code.scrollHeight || 1, y = (code.scrollTop / sh) * lines.length * lh, hh = (code.clientHeight / sh) * lines.length * lh;
  x.fillStyle = rgba(C.ink, .06); x.fillRect(4, y, w - 4, hh);
  x.strokeStyle = rgba(C.ink, .22); x.strokeRect(4.5, y + .5, w - 5, hh - 1);
  x.fillStyle = C.accent; x.fillRect(4, cur.r * lh, w - 4, Math.max(1.5, lh));
}
mini.addEventListener("pointerdown", (e) => {
  if (!file) return;
  noteUser();
  const r = mini.getBoundingClientRect(), lh = Math.min(3, r.height / lines.length);
  if (mode !== "normal") { mode = "normal"; setMode("normal"); }
  setCursor(Math.floor((e.clientY - r.top) / lh), 0);
});
function trackHeat(dt) {
  if (!file || mode === "shell") return;
  heat[cur.r] = (heat[cur.r] || 0) + dt;
  const a = Math.min(.9, heat[cur.r] / 6);
  rows[cur.r] && (rows[cur.r].num.style.boxShadow = `inset 2px 0 0 ${rgba(C.accent, a)}`);
}

/* ---------- autopilot ---------- */
let lastUser = -1e9;
function noteUser() { lastUser = performance.now(); }
addEventListener("pointerdown", noteUser);
async function idle() {
  while (leaving || performance.now() - lastUser < 6000 || document.hidden) await sleep(300);
}
async function press(k, base = 75) {
  await idle();
  hands.press(k);
  handleKey(k, true);
  await sleep(base + Math.random() * base * 1.4);
}
async function typeCmd(s) {
  for (;;) {
    await idle();
    if (!file) return;
    if (mode !== "normal") { await press("Escape"); continue; }
    const started = performance.now();
    await press(":", 160);
    let broke = false;
    for (const ch of s) { if (lastUser > started) { broke = true; break; } await press(ch, 55); }
    if (broke || lastUser > started) { if (mode === "cmd") handleKey("Escape", true); continue; }
    await sleep(240);
    await press("Enter", 200);
    return;
  }
}
async function shell(cmd) {
  shellLine("");
  await sleep(500);
  let s = "";
  for (const ch of cmd) { await idle(); s += ch; shellLine(s); hands.press(ch); await sleep(45 + Math.random() * 70); }
  await sleep(320);
  hands.press("Enter");
  shellLine(s, false);
  await sleep(240);
}
const PLAN = ["jjjj", "w", "www", "jj", "~", "}", "jjj", "ww", "C-d", "kkk", "~", "b", "jjjjj", "$", "0", "j", "~", "{", "C-d", "jjj"];
async function visit(k) {
  const f = CODE[k % CODE.length];
  await shell(`nvim ~/Projects/${f.path}`);
  openFile(f);
  await sleep(1100);
  const steps = PLAN.slice(k % 4).concat(PLAN.slice(0, k % 4));
  for (let s = 0; s < steps.length; s++) {
    if (file !== f) return;
    if (mode !== "normal") { await idle(); if (file !== f) return; if (mode !== "normal") await press("Escape"); }
    const step = steps[s];
    if (step === "~") {
      await idle();
      const top = Math.floor(code.scrollTop / 13), vis = Math.floor(code.clientHeight / 13);
      const cand = []; for (let i = top; i < Math.min(lines.length, top + vis - 2); i++) if (lines[i].text.trim().length > 12 && i !== cur.r) cand.push(i);
      if (cand.length) scramble(cand[(Math.random() * cand.length) | 0]);
      await sleep(900);
    } else if (step === "C-d") { await press("C-d", 400); }
    else for (const ch of step) await press(ch, 90);
    await sleep(380 + Math.random() * 520);
    if (s === 4 && !eyeE) { await typeCmd("!./iris --watch"); await sleep(1600); }
    if (s === 11 && k % 2 === 1 && !store.get("bg")) { await typeCmd(`colorscheme ${nextPalette()}`); await sleep(1200); }
  }
  if (file !== f) return;
  await sleep(1400);
  await typeCmd("qa");
  await sleep(500);
}
async function autopilot() {
  for (let k = 0; ; k++) {
    await visit(k);
    while (file) await sleep(400);   // you opened it; wait for :q
  }
}

/* ---------- loop + boot ---------- */
let frameN = 0;
function loop(t) {
  const dt = lastFrame ? Math.min(.05, (t - lastFrame) / 1000) : 1 / 60;
  lastFrame = t;
  if (!document.hidden) {
    hands.draw(t);
    tickEye(t, dt);
    trackHeat(dt);
    if (++frameN % 6 === 0) drawMini();
  }
  requestAnimationFrame(loop);
}
if (reduced) { openFile(CODE[0]); setCmd('<span class="msg">hjkl to move · :help · enter ↩ to come in</span>', true); }
else autopilot();
document.fonts && document.fonts.ready.then(() => addEventListener("resize", () => file && scrollToCursor()));
requestAnimationFrame(loop);
</script>
